# Remplace le texte d'une release existante par docs/releases/<etiquette>.md
# (lancement manuel : onglet Actions > "Notes de release" > Run workflow).
# Les nouvelles releases utilisent ce fichier directement s'il existe au moment de l'etiquette.
name: Notes de release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiquette de la release (ex. v0.1.4)"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mise a jour du texte de la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Etiquette invalide : $TAG" >&2
            exit 1
          fi
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "Fichier $notes introuvable" >&2
            exit 1
          fi
          gh release edit "$TAG" --notes-file "$notes"
