# ---------------------------------------------------------------------------
# Configuration de l'application
# ---------------------------------------------------------------------------

# Nom affiche du produit (PROVISOIRE). Le changer ici suffit : titre de la
# fenetre, barre laterale, ecran d'accueil.
app.name=FinanceApp

# Nom technique du dossier de donnees. Volontairement independant de app.name
# pour qu'un changement de nom commercial ne "perde" pas les donnees.
app.id=financeapp

# Dossier de donnees force (vide = emplacement standard du systeme :
# %APPDATA%\financeapp, ~/Library/Application Support/financeapp,
# ~/.local/share/financeapp). Surchargeable : -Dapp.data-dir=/chemin
app.data-dir=

app.version=@project.version@

# Depot GitHub des releases, pour signaler une nouvelle version. La verification
# est desactivee par defaut (Parametres > Mises a jour) ; vide = jamais de connexion.
app.update-repository=SkyWace/Finance-APP

# ---------------------------------------------------------------------------
# Journalisation : diagnostic technique uniquement. Aucun montant, libelle ni
# mot de passe n'est jamais ecrit dans les logs.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.flywaydb=WARN
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=7
spring.main.log-startup-info=false
